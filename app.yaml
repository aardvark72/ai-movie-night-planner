# Databricks App V2 Configuration
# AI Movie Night Planner

# App metadata
name: ai-movie-night-planner
display_name: "AI Movie Night Planner"
description: "AI-powered movie recommendations using Databricks Foundation Models"

# Runtime configuration
runtime:
  python_version: "3.10"
  
# Entry point
command:
  - "streamlit"
  - "run"
  - "streamlit_app/app.py"
  - "--server.port=8080"
  - "--server.address=0.0.0.0"
  - "--server.headless=true"
  - "--server.enableCORS=false"

# Environment variables
env:
  - name: LAKEBASE_CONNECTION_URL
    value: "postgresql://admin:npg_Z1Elj0zTJKYH@ep-calm-sound-d3druefy.database.eu-west-1.cloud.databricks.com/databricks_postgres?sslmode=require"

# Resource requirements
resources:
  cpu: "2"
  memory: "4Gi"

# Networking
network:
  ingress:
    - port: 8080
      protocol: "HTTP"
